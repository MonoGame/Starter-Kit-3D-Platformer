name: Validate template

# Validates the 3D Platformer template on Windows, macOS and Linux using the shared
# MonoGame/monogame-actions/sample-template-validator composite action. The action reads this template's
# declared platforms (and its monogame.platforms map) and runs the applicable structural + build
# tests; this workflow only owns the OS matrix and points the action at this template.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DotnetVersion: 10.0.301
  XCodeVersion: 26.5

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, workload: '' }       # builds desktop (DesktopVK) + windows (WindowsDX12)
          - { os: macos-latest,   workload: ios }      # builds desktop + ios
          - { os: ubuntu-latest,  workload: android }  # builds desktop + android

    steps:
      - uses: actions/checkout@v7

      - name: Generate global.json
        run: |
          echo '{ "sdk": { "version": "${{ env.DotnetVersion }}" } }' > global.json
          echo "runner.arch=${{ runner.arch }}"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ env.DotnetVersion }}'
          global-json-file: "./global.json"
          
      - name: Setup Android Dependencies
        if: runner.arch != 'arm64'
        uses: monogame/monogame-actions/install-android-dependencies@v1

      - name: Setup DotNet on Windows
        if: runner.environment == 'github-hosted' && runner.os == 'windows'
        run: |
          dotnet workload install android ios --version ${{ env.DotnetVersion }}

      - name: Setup DotNet on linux
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'x64'
        run: |
          dotnet workload install android --version ${{ env.DotnetVersion }}

      - name: Update Homebrew
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: |
          brew update

      - name: Setup DotNet on MacOS
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        run: |
          dotnet workload install macos ios --version ${{ env.DotnetVersion }}

      - name: Pin xcode version
        uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted' && runner.os == 'macos'
        with:
          xcode-version: '${{ env.XCodeVersion }}'

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Disable Annotations
        run: echo "::remove-matcher owner=csc::"

      - name: Setup Wine
        uses: monogame/monogame-actions/install-wine@v1

      - name: Install Fonts
        uses: monogame/monogame-actions/install-fonts@v1
        
      - name: Install SDL2 deps on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libjack-jackd2-dev libsndio-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libpipewire-0.3-dev libdecor-0-dev

      - name: Validate the 3D Platformer template
        uses: MonoGame/monogame-actions/sample-template-validator@v1
        with:
          template: .
          workload: ${{ matrix.workload }}
